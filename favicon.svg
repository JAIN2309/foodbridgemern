<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- FoodBridge Brand Gradient: Blue -> Purple -> Green -->
    <linearGradient id="foodbridge-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb" />
      <stop offset="50%" stop-color="#9333ea" />
      <stop offset="100%" stop-color="#16a34a" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Background Squircle -->
  <rect width="512" height="512" rx="140" fill="url(#foodbridge-bg)" />

  <!-- Outer Pulse Ring -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="#ffffff" stroke-width="12" stroke-opacity="0.2" />

  <!-- Center Emblem Group -->
  <g filter="url(#glow)" transform="translate(0, 0)">
    <!-- Food Bowl Base -->
    <path d="M 128 290 C 128 380, 384 380, 384 290 Z" fill="#ffffff" />
    <!-- Bowl Rim Line -->
    <rect x="110" y="270" width="292" height="24" rx="12" fill="#ffffff" />
    
    <!-- Heart Symbol Floating Above Bowl (Bridging Hunger with Hope) -->
    <path d="M 256 220 
             C 256 220, 170 145, 170 95 
             A 45 45 0 0 1 245 65 
             L 256 80 
             L 267 65 
             A 45 45 0 0 1 342 95 
             C 342 145, 256 220, 256 220 Z" 
          fill="#ffffff" />
  </g>
</svg>
