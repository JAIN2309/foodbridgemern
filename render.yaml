# ───────────────────────────────────────────────────────────
# Render Blueprint — deploy the FoodBridge backend as a
# Node.js web service.  Push this file to the repo root,
# then connect the repo in the Render dashboard.
# ───────────────────────────────────────────────────────────
services:
  - type: web
    name: foodbridge-api
    runtime: node
    region: oregon
    plan: free
    buildCommand: cd backend && npm install
    startCommand: cd backend && npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGODB_URI
        sync: false          # set manually in Render dashboard
      - key: JWT_SECRET
        sync: false
      - key: REDIS_URL
        sync: false
      - key: CLIENT_URL
        sync: false          # e.g. https://jain2309.github.io
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
