<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>FoodBridge — Redirecting…</title>
  <script>
    // GitHub Pages SPA redirect hack
    // When GitHub Pages serves a 404 for a deep route like /foodbridgemern/dashboard,
    // this page redirects to index.html with the path encoded as a query param,
    // and the main index.html picks it up and restores the correct route.
    const segment = 1; // number of path segments to keep (repo name)
    const loc = window.location;
    loc.replace(
      loc.protocol + '//' + loc.hostname + (loc.port ? ':' + loc.port : '') +
      loc.pathname.split('/').slice(0, 1 + segment).join('/') + '/?' +
      loc.pathname.slice(1).split('/').slice(segment).join('/') +
      (loc.search ? '&' + loc.search.slice(1) : '') +
      loc.hash
    );
  </script>
</head>
<body>
  <p>Redirecting&hellip;</p>
</body>
</html>
